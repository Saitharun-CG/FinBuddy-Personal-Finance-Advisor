
<script src="../js/main.js"></script>
<script>
async function loadDashboard() {
  const user = getUser();

  if (!user || !user.email ||
      user.email.toLowerCase() === "demo@finpilot.in") {
    window.location.replace("login.html");
    return;
  }

  const greet = document.getElementById("greet");
  const sidebar = document.getElementById("sb-user");

  if (greet) {
    greet.textContent =
      `Welcome, ${user.name || user.email}!`;
  }

  if (sidebar) {
    sidebar.replaceChildren();

    const name = document.createElement("strong");
    name.textContent = user.name || user.email;

    const email = document.createElement("div");
    email.textContent = user.email;

    sidebar.append(name, email);
  }

  try {
    const data = await api(
      "/api/dashboard?email=" + encodeURIComponent(user.email)
    );

    if (data.error || data.success === false) {
      throw new Error(data.error || "Could not load your dashboard.");
    }

    const d = data.dashboard || data.data || data;

    const values = {
      "kpi-income": d.monthly_income,
      "kpi-exp": d.monthly_expenses,
      "kpi-save": d.monthly_savings,
      "kpi-tax": d.annual_tax_estimate
    };

    for (const [id, value] of Object.entries(values)) {
      const element = document.getElementById(id);

      if (element) {
        element.textContent =
          value == null
            ? "—"
            : new Intl.NumberFormat("en-IN", {
                style: "currency",
                currency: "INR",
                maximumFractionDigits: 0
              }).format(Number(value));
      }
    }

    const scoreElement = document.getElementById("score-num");

    if (scoreElement) {
      scoreElement.textContent = d.financial_score ?? 0;
    }

    console.log("Dashboard loaded for:", user.email);
  } catch (error) {
    console.error("Dashboard loading error:", error);

    for (const id of [
      "kpi-income", "kpi-exp", "kpi-save", "kpi-tax"
    ]) {
      const element = document.getElementById(id);
      if (element) element.textContent = "Unavailable";
    }

    const insights = document.getElementById("insights-list");

    if (insights) {
      insights.textContent =
        "Unable to load your financial data. Please try again.";
    }
  }
}

loadDashboard();
</script>
