
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Smart Finance System</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h2>Smart Finance System</h2>
      <p>Login to your personal finance dashboard</p>

      <div id="message" role="alert"></div>

      <form id="login-form">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="login-button" type="submit">Login</button>
      </form>

      <p>
        Don't have an account?
        <a href="register.html">Register here</a>
      </p>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await api("/api/login", "POST", {
          email,
          password
        });

        if (!response || response.error || response.success === false) {
          throw new Error(
            response?.error || response?.message || "Login failed."
          );
        }

        const user = response.user || response;

        if (!user.email || user.email.toLowerCase() !== email.toLowerCase()) {
          throw new Error(
            "The server did not return the expected account. Check the backend login response."
          );
        }

        if (user.email.toLowerCase() === "demo@finpilot.in") {
          throw new Error("The backend returned demo account details.");
        }

        // Use the same storage key as the dashboard.
        const savedUser = {
          ...user,
          email: user.email,
          name: user.name || user.full_name || user.email
        };

        sessionStorage.setItem("fp_user", JSON.stringify(savedUser));

        window.location.href = "dashboard.html";
      } catch (error) {
        console.error("Login failed:", error);
        message.textContent = error.message || "Unable to log in.";
        message.style.color = "red";
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>
</body>
</html>
