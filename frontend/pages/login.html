<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login – FinPilot</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="orb orb-1" style="position:fixed"></div>
  <div class="orb orb-2" style="position:fixed"></div>
  <div class="auth-card">
    <div style="margin-bottom:1.5rem">
      <a href="../index.html" style="color:var(--accent);font-family:var(--font-head);font-size:1.2rem;text-decoration:none">◈ FinPilot</a>
    </div>
    <h2>Welcome back</h2>
    <p>Login to your financial dashboard</p>
    <div id="msg" class="alert" style="display:none"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"/>
    </div>
    <button class="btn-primary" style="width:100%;padding:.85rem" onclick="doLogin()">Login →</button>
    <div class="auth-link">
      Don't have an account? <a href="register.html">Sign up free</a>
    </div>
    <div class="auth-link" style="margin-top:.5rem">
      <a href="dashboard.html" style="color:var(--muted)">→ Skip to demo dashboard</a>
    </div>
  </div>
</div>
<script src="../js/main.js"></script>
<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  if (!email || !pass) { showAlert('msg','Fill in all fields','error'); return; }
  try {
    const r = await api('/login', 'POST', { email, password: pass });
    if (r.error) { showAlert('msg', r.error, 'error'); return; }
    setUser({ name: r.name, email });
    window.location.href = 'dashboard.html';
  } catch(e) {
    showAlert('msg','Cannot reach server – using demo mode','info');
    setUser({ name: 'Demo User', email: 'demo@finpilot.in' });
    setTimeout(() => window.location.href = 'dashboard.html', 1500);
  }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
